<!-- ⚙️ MÓDULO DE AUTOMATIZACIÓN E IMPORTACIÓN REAL DE EXCEL -->
<div class="admin-integration-panel">
    <h4>⚡ Módulo de Integración y Carga Automatizada</h4>
    
    <div style="background: #fff; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px; margin-bottom: 12px; text-align: left;">
        <label style="display:block; font-size:11px; font-weight:bold; color:#4a5568; margin-bottom:4px; text-transform:uppercase;">
            1. Seleccionar Base de Datos de Prueba (Excel)
        </label>
        <input type="file" id="inputExcelUsuarios" accept=".xlsx, .xls, .csv" style="font-size: 12px; width: 100%;">
    </div>

    <div class="integration-actions">
        <button id="btnProcesarExcel" class="btn-excel-sim" style="width: 100%; margin-bottom: 5px;">
            📥 Cargar y Crear Usuarios desde Excel
        </button>
        <button onclick="ejecutarSincronizacionSisco()" class="btn-sisco-sim" style="width: 100%;">
            🔄 Simular Sincronización SISCO (00:00 AM)
        </button>
    </div>
    
    <p class="integration-note">
        Sube tu archivo de Excel. El sistema extraerá los propietarios, creará sus cuentas con la contraseña temporal por defecto y los listará abajo [format-organize-outputs].
    </p>
</div>
