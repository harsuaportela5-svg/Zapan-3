<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bosques de Zapan 3 - Administración</title>
    
    <!-- 📦 Librería esencial para decodificar archivos binarios de Excel -->
    <script src="https://jsdelivr.net"></script>
    
    <!-- Enlace a los estilos externos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <div id="adminCard">
            <!-- Cabecera principal -->
            <div class="header-admin">
                <h2>Administración Central</h2>
                <button class="btn-danger" id="btnCerrarSesionAdmin">Salir</button>
            </div>

            <!-- Navegación por pestañas -->
            <div class="tabs">
                <div class="tab active" id="tabAdminCartera">📊 Cartera</div>
                <div class="tab" id="tabAdminParqueaderos">🚗 Parqueaderos</div>
            </div>

            <!-- Sección de Cartera e Integración -->
            <div id="secAdminCartera">
                <div class="modulo-carga">
                    <h3>⚡ Módulo de Integración y Carga Automatizada</h3>
                    
                    <div class="file-input-wrapper">
                        <label for="archivoExcel">1. SELECCIONAR BASE DE DATOS DE PRUEBA (EXCEL)</label>
                        <input type="file" id="archivoExcel" accept=".xlsx, .xls">
                    </div>

                    <button class="btn-block btn-success" id="btnProcesarExcel">📥 Cargar y Crear Usuarios desde Excel</button>
                    <button class="btn-block btn-primary">🔄 Simular Sincronización SISCO (00:00 AM)</button>

                    <div class="instrucciones">
                        Sube tu archivo de Excel. El sistema extraerá los propietarios, creará sus cuentas con la contraseña temporal por defecto y los listará abajo.
                    </div>
                </div>
            </div>
            
            <!-- Sección de Parqueaderos (Oculta por defecto) -->
            <div id="secAdminParqueaderos" class="hidden">
                <p class="txt-mute">Módulo de control de parqueaderos activo de forma correcta.</p>
            </div>
        </div>
    </div>

    <!-- Enlace al archivo de lógica JavaScript -->
    <script src="script.js"></script>
</body>
</html>
